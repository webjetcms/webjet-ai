plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'jacoco'
}

def releaseVersion = providers.gradleProperty('releaseVersion').getOrElse('0.1.0-SNAPSHOT')
def signingKey = providers.gradleProperty('signingKey')
def signingKeyId = providers.gradleProperty('signingKeyId')
def signingPassword = providers.gradleProperty('signingPassword')
def centralStagingDirectory = layout.buildDirectory.dir('central-staging')
def githubPackagesUrl = providers.gradleProperty('githubPackagesUrl')
    .getOrElse('https://maven.pkg.github.com/webjetcms/webjet-ai')
def githubPackagesUsername = providers.gradleProperty('githubUsername')
    .orElse(providers.environmentVariable('GITHUB_USERNAME'))
def githubPackagesToken = providers.gradleProperty('githubToken')
    .orElse(providers.environmentVariable('GITHUB_TOKEN'))

String signingKeyValue = signingKey.orNull
String signingKeyIdValue = signingKeyId.orNull
String gnupgKeyNameValue = providers.gradleProperty('signing.gnupg.keyName').orNull
boolean useInMemorySigningKey = signingKeyValue != null && signingKeyValue.contains('BEGIN PGP PRIVATE KEY BLOCK')
String localGpgKeyName = signingKeyIdValue ?: gnupgKeyNameValue ?: (useInMemorySigningKey ? null : signingKeyValue)
boolean skipReleaseConfirmation = providers.gradleProperty('skipReleaseConfirmation')
    .map { it.toBoolean() }
    .getOrElse(false)

group = 'com.webjetcms'
version = releaseVersion
description = 'Framework-neutral Java client for OpenAI, Google Gemini, and OpenRouter'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpmime:4.5.14'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'org.apache.commons:commons-text:1.14.0'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    manifest {
        attributes(
            'Automatic-Module-Name': 'com.webjetcms.ai',
            'Main-Class': 'com.webjetcms.ai.local.tool.LocalModelTool',
            'Implementation-Version': version
        )
    }
    from(project.file('LICENSE')) {
        into 'META-INF'
    }
    from(project.file('NOTICE')) {
        into 'META-INF'
    }
}

tasks.register('localModelTool', JavaExec) {
    group = 'application'
    description = 'Runs the local-model preparation tool directly from compiled classes.'
    classpath = sourceSets.main.output
    mainClass = 'com.webjetcms.ai.local.tool.LocalModelTool'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

ext.configureJavaArtifact = { target, String moduleName ->
    ['java-library', 'maven-publish', 'signing', 'jacoco'].each { target.pluginManager.apply(it) }
    target.group = group; target.version = version
    target.repositories { mavenCentral() }
    target.java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar(); withJavadocJar() }
    target.tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
    target.tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
    target.tasks.named('jar') {
        manifest { attributes('Automatic-Module-Name': moduleName, 'Implementation-Version': target.version) }
        from(rootProject.file('LICENSE')) { into 'META-INF' }; from(rootProject.file('NOTICE')) { into 'META-INF' }
    }
    target.tasks.named('test') { useJUnitPlatform { excludeTags 'local-model-smoke' }; finalizedBy target.tasks.jacocoTestReport }
    target.tasks.named('jacocoTestReport') { dependsOn target.tasks.test; reports { xml.required = true; html.required = true } }
}

def forbiddenImportPrefixes = [
    'sk.iway.',
    'org.springframework.',
    'jakarta.servlet.',
    'javax.servlet.',
    'jakarta.persistence.',
    'javax.persistence.'
]

def registerStandaloneBoundary = { target, String taskDescription, String failureMessage ->
def boundary = target.tasks.register('checkStandaloneBoundary') {
    group = 'verification'
    description = taskDescription
    inputs.files(target.sourceSets.main.allJava)

    doLast {
        def violations = []
        target.sourceSets.main.allJava.files.sort().each { sourceFile ->
            int lineNumber = 0
            sourceFile.eachLine('UTF-8') { line ->
                lineNumber++
                String importedType = line.trim()
                if (importedType.startsWith('import ')) {
                    importedType = importedType.substring('import '.length()).trim()
                    if (importedType.startsWith('static ')) {
                        importedType = importedType.substring('static '.length()).trim()
                    }
                    String forbiddenPrefix = forbiddenImportPrefixes.find { importedType.startsWith(it) }
                    if (forbiddenPrefix != null) {
                        violations.add("${sourceFile}:${lineNumber}: ${line.trim()}")
                    }
                }
            }
        }

        if (violations.isEmpty() == false) {
            throw new GradleException(failureMessage + '\n' + violations.join('\n'))
        }
    }
}
boundary
}
ext.registerStandaloneBoundary = registerStandaloneBoundary
def checkStandaloneBoundary = registerStandaloneBoundary(project,
    'Rejects host-framework imports from the standalone AI library.',
    'webjet-ai must remain independent of WebJET CMS, Spring, servlet, and JPA APIs:')

def configurePublication = { target, String artifact, String pomName, String developerEmail,
    boolean includeIssueManagement ->
target.publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = artifact
            from target.components.java
            pom {
                name = pomName
                description = target.description
                url = 'https://github.com/webjetcms/webjet-ai'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        name = 'Lubos Balat'
                        email = developerEmail
                        organization = 'InterWay, a. s.'
                        organizationUrl = 'https://www.interway.sk'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/webjetcms/webjet-ai.git'
                    developerConnection = 'scm:git:ssh://git@github.com/webjetcms/webjet-ai.git'
                    url = 'https://github.com/webjetcms/webjet-ai'
                }
                if (includeIssueManagement) withXml {
                    def issueManagement = asNode().appendNode('issueManagement')
                    issueManagement.appendNode('system', 'GitHub')
                    issueManagement.appendNode('url', 'https://github.com/webjetcms/webjet-ai/issues')
                }
            }
        }
    }
    repositories {
        maven {
            name = 'CentralStaging'
            url = centralStagingDirectory
        }
        maven {
            name = 'GitHubPackages'
            url = target.uri(githubPackagesUrl)
            credentials {
                username = githubPackagesUsername.orNull
                password = githubPackagesToken.orNull
            }
        }
    }
}

if (useInMemorySigningKey == false && localGpgKeyName != null) {
    if (target.findProperty('signing.gnupg.keyName') == null) {
        target.ext.set('signing.gnupg.keyName', localGpgKeyName)
    }
    if (signingPassword.isPresent() && target.findProperty('signing.gnupg.passphrase') == null) {
        target.ext.set('signing.gnupg.passphrase', signingPassword.get())
    }
}

if (useInMemorySigningKey || localGpgKeyName != null) {
    target.signing {
        if (useInMemorySigningKey) {
            useInMemoryPgpKeys(signingKeyValue, signingPassword.orNull)
        } else {
            useGpgCmd()
        }
        sign target.publishing.publications.mavenJava
    }
}

// The Central bundle intentionally contains only Maven-standard artifacts.
target.tasks.withType(org.gradle.api.publish.tasks.GenerateModuleMetadata).configureEach {
    enabled = false
}
}

ext.configurePublication = configurePublication
configurePublication(project, 'webjet-ai', 'WebJET AI', 'info@webjet.eu', true)

def verifyPublicationArtifacts = tasks.register('verifyPublicationArtifacts') {
    group = 'verification'
    description = 'Checks the public JAR manifest, legal files, and Maven POM metadata.'
    dependsOn tasks.named('jar')
    dependsOn tasks.named('sourcesJar')
    dependsOn tasks.named('javadocJar')
    dependsOn tasks.named('generatePomFileForMavenJavaPublication')

    doLast {
        File mainJar = tasks.named('jar').get().archiveFile.get().asFile
        File sourcesJar = tasks.named('sourcesJar').get().archiveFile.get().asFile
        File javadocJar = tasks.named('javadocJar').get().archiveFile.get().asFile
        [mainJar, sourcesJar, javadocJar].each { artifact ->
            if (artifact.isFile() == false || artifact.length() == 0) {
                throw new GradleException("Missing publication artifact: ${artifact}")
            }
        }

        new java.util.jar.JarFile(mainJar).withCloseable { archive ->
            String moduleName = archive.manifest.mainAttributes.getValue('Automatic-Module-Name')
            if ('com.webjetcms.ai'.equals(moduleName) == false) {
                throw new GradleException("Unexpected Automatic-Module-Name: ${moduleName}")
            }
            String mainClass = archive.manifest.mainAttributes.getValue('Main-Class')
            if ('com.webjetcms.ai.local.tool.LocalModelTool'.equals(mainClass) == false) {
                throw new GradleException("Unexpected Main-Class: ${mainClass}")
            }
            String implementationVersion = archive.manifest.mainAttributes.getValue('Implementation-Version')
            if (releaseVersion.equals(implementationVersion) == false) {
                throw new GradleException("Unexpected Implementation-Version: ${implementationVersion}")
            }
            ['META-INF/LICENSE', 'META-INF/NOTICE'].each { entry ->
                if (archive.getEntry(entry) == null) {
                    throw new GradleException("The main JAR is missing ${entry}")
                }
            }
        }

        [['--help', 'webjet-ai-local-model-tool'], ['--version', releaseVersion]].each { cliCheck ->
            Process process = new ProcessBuilder(
                new File(System.getProperty('java.home'), 'bin/java').absolutePath,
                '-jar', mainJar.absolutePath, cliCheck[0]
            ).redirectErrorStream(true).start()
            String output = process.inputStream.getText('UTF-8')
            int exitCode = process.waitFor()
            boolean expectedOutput = '--version'.equals(cliCheck[0])
                ? cliCheck[1].equals(output.trim())
                : output.contains(cliCheck[1])
            if (exitCode != 0 || expectedOutput == false) {
                throw new GradleException("JAR ${cliCheck[0]} check failed with exit ${exitCode}: ${output.trim()}")
            }
        }

        File pomFile = layout.buildDirectory.file('publications/mavenJava/pom-default.xml').get().asFile
        def pom = new groovy.xml.XmlSlurper().parse(pomFile)
        def requiredValues = [
            'groupId': 'com.webjetcms',
            'artifactId': 'webjet-ai',
            'version': releaseVersion,
            'name': 'WebJET AI',
            'url': 'https://github.com/webjetcms/webjet-ai'
        ]
        requiredValues.each { element, expected ->
            String actual = pom."${element}".text()
            if (expected.equals(actual) == false) {
                throw new GradleException("Unexpected POM ${element}: ${actual}")
            }
        }
        if ('The Apache License, Version 2.0'.equals(pom.licenses.license.name.text()) == false) {
            throw new GradleException('The generated POM does not declare Apache License 2.0')
        }
        if ('https://github.com/webjetcms/webjet-ai'.equals(pom.scm.url.text()) == false) {
            throw new GradleException('The generated POM contains an unexpected SCM URL')
        }
    }
}

def validateReleaseConfiguration = tasks.register('validateReleaseConfiguration') {
    group = 'publishing'
    description = 'Rejects snapshots, malformed release versions, and missing signing credentials.'
    inputs.property('releaseVersion', releaseVersion)

    doLast {
        String selectedVersion = releaseVersion
        if ((selectedVersion ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)/) == false) {
            throw new GradleException(
                "Central publication requires a stable semantic version such as 0.1.0; received ${selectedVersion}"
            )
        }
        if (useInMemorySigningKey == false && localGpgKeyName == null) {
            throw new GradleException(
                'Central publication requires either signingKey as an ASCII-armored private key or signingKeyId/signing.gnupg.keyName for a local GPG key'
            )
        }
        if (useInMemorySigningKey && (signingPassword.isPresent() == false || signingPassword.get().isBlank())) {
            throw new GradleException('The signingPassword Gradle property is required when signingKey contains an in-memory private key')
        }
    }
}

def validateGitHubPackagesConfiguration = tasks.register('validateGitHubPackagesConfiguration') {
    group = 'publishing'
    description = 'Checks the version, signing setup, and GitHub Packages credentials.'
    inputs.property('releaseVersion', releaseVersion)

    doLast {
        String selectedVersion = releaseVersion
        if ((selectedVersion ==~ /(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-SNAPSHOT)?/) == false) {
            throw new GradleException(
                "GitHub Packages publication requires a semantic version such as 0.1.0 or 0.1.0-SNAPSHOT; received ${selectedVersion}"
            )
        }
        if (useInMemorySigningKey == false && localGpgKeyName == null) {
            throw new GradleException(
                'GitHub Packages publication requires either signingKey as an ASCII-armored private key or signingKeyId/signing.gnupg.keyName for a local GPG key'
            )
        }
        if (useInMemorySigningKey && (signingPassword.isPresent() == false || signingPassword.get().isBlank())) {
            throw new GradleException('The signingPassword Gradle property is required when signingKey contains an in-memory private key')
        }
        if (githubPackagesUsername.isPresent() == false || githubPackagesUsername.get().isBlank()) {
            throw new GradleException('GitHub Packages publication requires githubUsername Gradle property or GITHUB_USERNAME environment variable')
        }
        if (githubPackagesToken.isPresent() == false || githubPackagesToken.get().isBlank()) {
            throw new GradleException('GitHub Packages publication requires githubToken Gradle property or GITHUB_TOKEN environment variable')
        }
    }
}

def waitForConfirm = tasks.register('waitForConfirm') {
    group = 'publishing'
    description = 'Prints the resolved releaseVersion and waits for Enter before continuing a local release.'
    inputs.property('releaseVersion', releaseVersion)
    onlyIf { skipReleaseConfirmation == false }

    doLast {
        String message = "Check the artifact version (${releaseVersion}). Press Enter to continue or Ctrl+C to abort..."
        def console = System.console()
        if (console != null) {
            console.readLine('%s', message)
            return
        }

        File terminalDevice = new File('/dev/tty')
        if (terminalDevice.exists() && terminalDevice.canRead()) {
            try {
                terminalDevice.withReader('UTF-8') { reader ->
                    print(message)
                    System.out.flush()
                    reader.readLine()
                }
                return
            } catch (IOException ignored) {
                // Fall through to the non-interactive path when no controlling TTY is attached.
            }
        }

        println(message)
        println('No interactive console detected, continuing without confirmation prompt.')
    }
}

tasks.register('printReleaseVersion') {
    group = 'help'
    description = 'Prints the resolved releaseVersion without additional formatting.'
    inputs.property('releaseVersion', releaseVersion)

    doLast {
        println(releaseVersion)
    }
}

def prepareCentralStaging = tasks.register('prepareCentralStaging', Delete) {
    group = 'publishing'
    description = 'Removes stale files before creating a Central deployment bundle.'
    delete centralStagingDirectory
}

validateReleaseConfiguration.configure {
    dependsOn waitForConfirm
}

validateGitHubPackagesConfiguration.configure {
    dependsOn waitForConfirm
}

tasks.withType(Sign).configureEach {
    mustRunAfter validateReleaseConfiguration
    mustRunAfter validateGitHubPackagesConfiguration
}

tasks.named('publishMavenJavaPublicationToGitHubPackagesRepository') {
    dependsOn validateGitHubPackagesConfiguration
}

tasks.named('publishMavenJavaPublicationToCentralStagingRepository') {
    dependsOn validateReleaseConfiguration
    dependsOn prepareCentralStaging
    mustRunAfter prepareCentralStaging
}

def publishAllToCentralStaging = tasks.register('publishAllToCentralStaging') {
    group = 'publishing'
    description = 'Publishes both WebJET AI artifacts into the Central staging repository.'
    dependsOn tasks.named('publishMavenJavaPublicationToCentralStagingRepository')
    dependsOn project(':webjet-ai-local').tasks.named('publishMavenJavaPublicationToCentralStagingRepository')
}

def generateCentralChecksums = tasks.register('generateCentralChecksums') {
    group = 'publishing'
    description = 'Adds the MD5 and SHA-1 checksum files required by Maven Central.'
    dependsOn publishAllToCentralStaging
    doNotTrackState('The task augments a Maven repository generated by maven-publish.')

    doLast {
        File stagingDirectory = centralStagingDirectory.get().asFile
        if (stagingDirectory.isDirectory() == false) {
            throw new GradleException("Central staging directory was not created: ${stagingDirectory}")
        }

        def stagedFiles = []
        stagingDirectory.eachFileRecurse(groovy.io.FileType.FILES) { stagedFiles.add(it) }
        stagedFiles.findAll { file ->
            file.name.startsWith('maven-metadata')
                || file.name.endsWith('.md5')
                || file.name.endsWith('.sha1')
                || file.name.endsWith('.sha256')
                || file.name.endsWith('.sha512')
        }.each { generatedFile ->
            if (generatedFile.delete() == false) {
                throw new GradleException("Unable to remove generated file: ${generatedFile}")
            }
        }

        stagedFiles.findAll { file ->
            file.exists() && file.name.endsWith('.asc') == false
        }.sort().each { artifact ->
            [MD5: '.md5', SHA1: '.sha1'].each { algorithm, extension ->
                byte[] digest = java.security.MessageDigest.getInstance(algorithm).digest(artifact.bytes)
                new File(artifact.parentFile, artifact.name + extension)
                    .setText(digest.encodeHex().toString() + System.lineSeparator(), 'US-ASCII')
            }
        }
    }
}

def validateCentralBundle = tasks.register('validateCentralBundle') {
    group = 'publishing'
    description = 'Verifies the exact Maven Central repository layout before it is zipped.'
    dependsOn generateCentralChecksums

    doLast {
        String artifactVersion = releaseVersion
        ['webjet-ai', 'webjet-ai-local'].each { artifactId ->
            File versionDirectory = centralStagingDirectory
                .map { it.dir("com/webjetcms/${artifactId}/${artifactVersion}") }
                .get()
                .asFile
            def baseNames = [
                "${artifactId}-${artifactVersion}.pom",
                "${artifactId}-${artifactVersion}.jar",
                "${artifactId}-${artifactVersion}-sources.jar",
                "${artifactId}-${artifactVersion}-javadoc.jar"
            ]
            def expectedNames = [] as Set
            baseNames.each { baseName ->
                expectedNames.add(baseName)
                expectedNames.add(baseName + '.asc')
                expectedNames.add(baseName + '.md5')
                expectedNames.add(baseName + '.sha1')
            }

            if (versionDirectory.isDirectory() == false) {
                throw new GradleException("Missing Maven version directory: ${versionDirectory}")
            }
            Set<String> actualNames = versionDirectory.listFiles()
                .findAll { it.isFile() }
                .collect { it.name } as Set
            if (actualNames != expectedNames) {
                throw new GradleException(
                    "Unexpected Central bundle files for ${artifactId}. Missing: ${expectedNames - actualNames}; extra: ${actualNames - expectedNames}"
                )
            }

            baseNames.each { baseName ->
                File signature = new File(versionDirectory, baseName + '.asc')
                String md5 = new File(versionDirectory, baseName + '.md5').getText('US-ASCII').trim()
                String sha1 = new File(versionDirectory, baseName + '.sha1').getText('US-ASCII').trim()
                if (signature.length() == 0 || (md5 ==~ /[0-9a-f]{32}/) == false || (sha1 ==~ /[0-9a-f]{40}/) == false) {
                    throw new GradleException("Invalid signature or checksum for ${baseName}")
                }
            }
        }
    }
}

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Creates the signed Maven-layout bundle accepted by the Central Publisher API.'
    dependsOn validateCentralBundle
    from centralStagingDirectory
    destinationDirectory = layout.buildDirectory.dir('central')
    archiveFileName = 'central-bundle.zip'
}

tasks.named('check') {
    dependsOn checkStandaloneBoundary
    dependsOn verifyPublicationArtifacts
    dependsOn jacocoTestReport
    dependsOn project(':webjet-ai-local').tasks.named('check')
}

tasks.named('javadoc') {
    dependsOn project(':webjet-ai-local').tasks.named('javadoc')
}

tasks.named('jar') {
    dependsOn checkStandaloneBoundary
}
