name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 17 build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and verify artifacts
        shell: bash
        run: ./gradlew --no-daemon clean check javadoc

      - name: Prepare portable embedding bundle on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          ./gradlew --no-daemon :webjet-ai-local:localModelTool
          --args='prepare --model multilingual-e5-small --output build/local-smoke/model.zip'

      - name: Run native embedding inference on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          ./gradlew --no-daemon :webjet-ai-local:localModelSmokeTest
          -PlocalModelBundle=webjet-ai-local/build/local-smoke/model.zip

      - name: Confirm the build did not modify sources
        run: git diff --exit-code

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/reports/jacoco/
            webjet-ai-local/build/reports/tests/
            webjet-ai-local/build/reports/jacoco/
          if-no-files-found: ignore
          retention-days: 7
